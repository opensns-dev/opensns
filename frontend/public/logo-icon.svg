<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="icon-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="icon-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="icon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#icon-main)" stroke-width="3.5" fill="none"/>
  
  <!-- Inner "S" flow shape -->
  <path d="M15 17 Q24 12 33 17 Q28 24 24 24 Q20 24 15 31 Q24 36 33 31" 
        stroke="url(#icon-accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Network/AI spark points -->
  <circle cx="15" cy="17" r="3" fill="#f97316"/>
  <circle cx="33" cy="31" r="3" fill="#fbbf24"/>
  <circle cx="24" cy="24" r="4" fill="url(#icon-main)" filter="url(#icon-glow)"/>
</svg>
