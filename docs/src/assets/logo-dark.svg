<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="main-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="accent-grad-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon: Abstract "O" with network/AI spark -->
  <g transform="translate(8, 8)">
    <!-- Outer ring with gradient -->
    <circle cx="22" cy="22" r="20" stroke="url(#main-grad-dark)" stroke-width="3" fill="none"/>
    
    <!-- Inner dynamic shape - abstract "S" flow -->
    <path d="M14 16 Q22 12 30 16 Q26 22 22 22 Q18 22 14 28 Q22 32 30 28" 
          stroke="url(#accent-grad-dark)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Spark dots representing AI/network -->
    <circle cx="14" cy="16" r="2.5" fill="#fb923c"/>
    <circle cx="30" cy="28" r="2.5" fill="#fde047"/>
    <circle cx="22" cy="22" r="3" fill="url(#main-grad-dark)" filter="url(#glow-dark)"/>
  </g>
  
  <!-- Text: OpenSNS -->
  <text x="62" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#fafafa">Open</tspan><tspan fill="url(#main-grad-dark)" font-weight="700">SNS</tspan>
  </text>
</svg>
