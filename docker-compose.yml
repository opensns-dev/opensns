services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opensns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensns_password}
      POSTGRES_DB: opensns
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensns"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://opensns:${POSTGRES_PASSWORD:-opensns_password}@postgres:5432/opensns
      
      # Security (REQUIRED - generate with: openssl rand -hex 32)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?API_KEY_ENCRYPTION_KEY is required}
      
      # AI Engine API Keys (optional - users can provide in settings)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      
      # UGC Video Engine API Keys (optional)
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      DID_API_KEY: ${DID_API_KEY:-}
      SADTALKER_URL: ${SADTALKER_URL:-}
      
      # Default Engines
      DEFAULT_LLM_ENGINE: ${DEFAULT_LLM_ENGINE:-openai}
      DEFAULT_IMAGE_ENGINE: ${DEFAULT_IMAGE_ENGINE:-fal}
      DEFAULT_VIDEO_ENGINE: ${DEFAULT_VIDEO_ENGINE:-fal-video}
      DEFAULT_UGC_ENGINE: ${DEFAULT_UGC_ENGINE:-heygen}
      
      # Local Engines (optional)
      OLLAMA_URL: ${OLLAMA_URL:-}
      COMFYUI_URL: ${COMFYUI_URL:-}
      
      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # Paddle Billing (optional)
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_PRICE_ID_BASIC: ${PADDLE_PRICE_ID_BASIC:-}
      PADDLE_PRICE_ID_PRO: ${PADDLE_PRICE_ID_PRO:-}
      PADDLE_PRICE_ID_ULTRA: ${PADDLE_PRICE_ID_ULTRA:-}
      PADDLE_PRICE_ID_CREDITS_50: ${PADDLE_PRICE_ID_CREDITS_50:-}
      PADDLE_PRICE_ID_CREDITS_150: ${PADDLE_PRICE_ID_CREDITS_150:-}
      PADDLE_PRICE_ID_CREDITS_500: ${PADDLE_PRICE_ID_CREDITS_500:-}
      
      # Email (optional)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
