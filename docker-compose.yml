services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opensns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensns_password}
      POSTGRES_DB: opensns
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensns"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    image: opensns/backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - frontend-net
      - backend-net
    environment:
      DATABASE_URL: postgresql://opensns:${POSTGRES_PASSWORD:-opensns_password}@postgres:5432/opensns
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?API_KEY_ENCRYPTION_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      DID_API_KEY: ${DID_API_KEY:-}
      SADTALKER_URL: ${SADTALKER_URL:-}
      DEFAULT_LLM_ENGINE: ${DEFAULT_LLM_ENGINE:-openai}
      DEFAULT_IMAGE_ENGINE: ${DEFAULT_IMAGE_ENGINE:-fal}
      DEFAULT_VIDEO_ENGINE: ${DEFAULT_VIDEO_ENGINE:-fal-video}
      DEFAULT_UGC_ENGINE: ${DEFAULT_UGC_ENGINE:-heygen}
      OLLAMA_URL: ${OLLAMA_URL:-}
      COMFYUI_URL: ${COMFYUI_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_VARIANT_ID_BASIC: ${LEMONSQUEEZY_VARIANT_ID_BASIC:-}
      LEMONSQUEEZY_VARIANT_ID_BYOK: ${LEMONSQUEEZY_VARIANT_ID_BYOK:-}
      LEMONSQUEEZY_VARIANT_ID_PRO: ${LEMONSQUEEZY_VARIANT_ID_PRO:-}
      LEMONSQUEEZY_VARIANT_ID_ULTRA: ${LEMONSQUEEZY_VARIANT_ID_ULTRA:-}
      LEMONSQUEEZY_VARIANT_ID_CREDITS_50: ${LEMONSQUEEZY_VARIANT_ID_CREDITS_50:-}
      LEMONSQUEEZY_VARIANT_ID_CREDITS_150: ${LEMONSQUEEZY_VARIANT_ID_CREDITS_150:-}
      LEMONSQUEEZY_VARIANT_ID_CREDITS_500: ${LEMONSQUEEZY_VARIANT_ID_CREDITS_500:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-opensns-assets}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000/opensns-assets}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    image: opensns/frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - frontend-net
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  worker:
    image: opensns/backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: taskiq worker app.worker:broker --workers 2 --fs-discover
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://opensns:${POSTGRES_PASSWORD:-opensns_password}@postgres:5432/opensns
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?API_KEY_ENCRYPTION_KEY is required}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-opensns-assets}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000/opensns-assets}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
