services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opensns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensns_password}
      POSTGRES_DB: opensns
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensns"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    image: opensns/backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - frontend-net
      - backend-net
    environment:
      DATABASE_URL: postgresql://opensns:${POSTGRES_PASSWORD:-opensns_password}@postgres:5432/opensns
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?API_KEY_ENCRYPTION_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      DID_API_KEY: ${DID_API_KEY:-}
      SADTALKER_URL: ${SADTALKER_URL:-}
      DEFAULT_LLM_ENGINE: ${DEFAULT_LLM_ENGINE:-openai}
      DEFAULT_IMAGE_ENGINE: ${DEFAULT_IMAGE_ENGINE:-fal}
      DEFAULT_VIDEO_ENGINE: ${DEFAULT_VIDEO_ENGINE:-fal-video}
      DEFAULT_UGC_ENGINE: ${DEFAULT_UGC_ENGINE:-heygen}
      OLLAMA_URL: ${OLLAMA_URL:-}
      COMFYUI_URL: ${COMFYUI_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_PRICE_ID_BASIC: ${PADDLE_PRICE_ID_BASIC:-}
      PADDLE_PRICE_ID_PRO: ${PADDLE_PRICE_ID_PRO:-}
      PADDLE_PRICE_ID_ULTRA: ${PADDLE_PRICE_ID_ULTRA:-}
      PADDLE_PRICE_ID_CREDITS_50: ${PADDLE_PRICE_ID_CREDITS_50:-}
      PADDLE_PRICE_ID_CREDITS_150: ${PADDLE_PRICE_ID_CREDITS_150:-}
      PADDLE_PRICE_ID_CREDITS_500: ${PADDLE_PRICE_ID_CREDITS_500:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    image: opensns/frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - frontend-net
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
