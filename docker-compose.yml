services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opensns
      POSTGRES_PASSWORD: opensns_password
      POSTGRES_DB: opensns
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensns"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://opensns:opensns_password@postgres:5432/opensns
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production-min-32-chars}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:-change-this-encryption-key-32chars}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      DEFAULT_LLM_ENGINE: ${DEFAULT_LLM_ENGINE:-mock}
      DEFAULT_IMAGE_ENGINE: ${DEFAULT_IMAGE_ENGINE:-fal}
      DEFAULT_VIDEO_ENGINE: ${DEFAULT_VIDEO_ENGINE:-fal-video}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
