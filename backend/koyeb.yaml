name: opensns-backend
type: web
instance_type: nano
regions:
  - fra
  - was
  - sin
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
scaling:
  min: 1
  max: 3
health_checks:
  - port: 8000
    path: /health
    protocol: http
env:
  - key: DATABASE_URL
    secret: database-url
  - key: JWT_SECRET_KEY
    secret: jwt-secret-key
  - key: API_KEY_ENCRYPTION_KEY
    secret: api-key-encryption-key
  - key: OPENAI_API_KEY
    secret: openai-api-key
  - key: FAL_KEY
    secret: fal-key
  - key: FRONTEND_URL
    value: https://opensns.vercel.app
  - key: CORS_ORIGINS
    value: https://opensns.vercel.app,http://localhost:3000
  - key: PADDLE_ENVIRONMENT
    value: production
  - key: TESTING
    value: "0"
