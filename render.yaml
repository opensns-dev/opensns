services:
  - type: web
    name: opensns-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python start.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opensns-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: API_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: opensns-frontend
          property: url
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: opensns-frontend
          property: url
      - key: DEBUG
        value: "false"
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_BASIC
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_BYOK
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_PRO
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_ULTRA
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_CREDITS_50
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_CREDITS_150
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID_CREDITS_500
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: opensns-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: bun install --frozen-lockfile && BUILD_STANDALONE=true bun run build:standalone
    startCommand: bun .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: opensns-backend
          property: url
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: opensns-backend
          property: url
      - key: BUILD_STANDALONE
        value: "true"
      - key: NODE_ENV
        value: production

databases:
  - name: opensns-db
    plan: free
    databaseName: opensns
    user: opensns
